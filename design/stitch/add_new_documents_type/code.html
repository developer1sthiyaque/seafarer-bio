<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Documents Type Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maritime: {
              navy: '#0B1F3A',
              navyDark: '#071527',
              ivory: '#FAF9F6',
              parchment: '#F4F3F0',
              border: '#E6E2DA',
              brass: '#B8924A',
              brassMuted: '#D4AF37',
              slate: '#6B7280',
              slateDark: '#4A5568',
              slateLight: '#9CA3AF'
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900/60 font-sans antialiased text-slate-800 m-0 p-0 flex justify-center items-end min-h-screen select-none">
  <!-- Device Frame (Simulated Mobile Screen 390x844 with Backing Dim / Blur) -->
  <div class="relative w-full max-w-[390px] h-[844px] bg-[#1a2332]/40 backdrop-blur-[2px] overflow-hidden flex flex-col justify-end shadow-2xl">
    
    <!-- Contextual background mock showing the Bio-Data screen under dim/scrim -->
    <div class="absolute inset-0 p-5 opacity-30 pointer-events-none flex flex-col gap-4 filter blur-[1px]">
      <!-- Fake status bar -->
      <div class="flex justify-between items-center text-xs text-white pt-2 font-mono">
        <span>09:41</span>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-3 h-2 bg-white rounded-xs"></span>
          <span class="inline-block w-4 h-2.5 border border-white rounded-xs"></span>
        </div>
      </div>
      <!-- Fake page header -->
      <div class="mt-4 flex items-center justify-between">
        <div class="h-6 w-32 bg-white/40 rounded"></div>
        <div class="h-8 w-8 rounded-full bg-white/30"></div>
      </div>
      <!-- Fake card list -->
      <div class="mt-4 space-y-3">
        <div class="h-20 bg-white/60 rounded-xl"></div>
        <div class="h-32 bg-white/60 rounded-xl"></div>
        <div class="h-40 bg-white/60 rounded-xl"></div>
      </div>
    </div>

    <!-- Semi-transparent touch dismiss backdrop overlay -->
    <div class="absolute inset-0 bg-maritime-navy/50 backdrop-blur-[3px] transition-opacity"></div>

    <!-- Modal Bottom Sheet Surface -->
    <div class="relative z-10 w-full bg-[#FFFFFF] rounded-t-[24px] border-t border-maritime-border shadow-[0_-10px_30px_rgba(11,31,58,0.12)] flex flex-col pt-3 pb-8 px-6 transition-transform">
      
      <!-- Top Drag Handle Pill -->
      <div class="flex justify-center w-full mb-3">
        <div class="w-11 h-1.5 bg-[#D8D4CC] rounded-full"></div>
      </div>

      <!-- Sheet Header -->
      <div class="flex items-center justify-between pb-4 border-b border-maritime-border/80">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-widest text-maritime-brass font-sans">Official Dossier</span>
          <h2 class="font-serif text-[20px] font-semibold text-maritime-navy leading-snug tracking-tight">
            Add New Documents Type
          </h2>
        </div>
        <button 
          type="button" 
          aria-label="Close" 
          class="w-9 h-9 rounded-full bg-maritime-ivory hover:bg-maritime-parchment active:scale-95 text-maritime-slate hover:text-maritime-navy flex items-center justify-center border border-maritime-border transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Form Body -->
      <div class="mt-5 space-y-4">
        <div>
          <!-- Label: Documents Name in Plus Jakarta Sans 12px uppercase tracking-wider, slate text -->
          <label for="document-name" class="block font-sans text-[12px] font-bold uppercase tracking-wider text-maritime-slate mb-2">
            Documents Name
          </label>
          
          <!-- Text input with document/badge icon placeholder -->
          <div class="relative flex items-center rounded-xl bg-maritime-ivory border border-maritime-border focus-within:border-maritime-navy focus-within:ring-2 focus-within:ring-maritime-navy/10 transition-all">
            <!-- Icon -->
            <div class="pl-3.5 pr-2.5 text-maritime-brass flex items-center pointer-events-none">
              <svg class="w-5 h-5 stroke-[1.6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            
            <input 
              type="text" 
              id="document-name" 
              name="document_name"
              placeholder="Enter document type name, e.g. Yellow Fever Certificate, Flag Endorsement"
              class="w-full py-3.5 pr-3.5 bg-transparent text-[14px] text-maritime-navy placeholder:text-maritime-slateLight font-sans focus:outline-none placeholder:text-[13px] placeholder:font-normal leading-relaxed"
              autofocus
            />
          </div>
          <p class="mt-1.5 text-[11px] text-maritime-slateLight flex items-center gap-1 font-sans">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-maritime-brass"></span>
            Categorized under statutory IMO STCW & company certifications.
          </p>
        </div>
      </div>

      <!-- Bottom Action -->
      <div class="mt-7">
        <button 
          type="button" 
          class="w-full h-12 bg-maritime-navy hover:bg-maritime-navyDark active:scale-[0.99] text-white font-sans font-semibold text-[15px] rounded-full shadow-[0_4px_14px_rgba(11,31,58,0.22)] flex items-center justify-center gap-2 transition-all">
          <span>Add to List</span>
          <svg class="w-4 h-4 text-maritime-brass" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      </div>

      <!-- Home Indicator bar on mobile -->
      <div class="flex justify-center mt-4">
        <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
      </div>

    </div>
  </div>
</body>
</html>
