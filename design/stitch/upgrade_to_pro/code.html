<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Upgrade to Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FAF9F6;
      color: #0B1F3A;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .brass-border {
      border-color: #B8924A;
    }
    .brass-text {
      color: #B8924A;
    }
    .brass-bg {
      background-color: #B8924A;
    }
    .brass-light-bg {
      background-color: rgba(184, 146, 74, 0.12);
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAF9F6] text-[#0B1F3A] flex flex-col justify-between">
  <!-- Top Bar & Safe Area Header -->
  <header class="w-full bg-[#FAF9F6] border-b border-[#E6E2DA] sticky top-0 z-30 px-5 pt-3 pb-3">
    <!-- Status bar mock space -->
    <div class="flex justify-between items-center text-xs font-semibold text-[#0B1F3A]/70 mb-2 px-1">
      <span>09:41</span>
      <div class="flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.27 19.57 10.58 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
        <div class="w-5 h-2.5 border border-[#0B1F3A]/70 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-full bg-[#0B1F3A]/80 rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Navigation Header -->
    <div class="flex items-center justify-between">
      <button type="button" aria-label="Go back" class="w-9 h-9 flex items-center justify-center rounded-full border border-[#E6E2DA] bg-[#FFFFFF] text-[#0B1F3A] hover:bg-[#F4F3F0] transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="text-base font-semibold tracking-tight text-[#0B1F3A]">Upgrade to Pro</h1>
      <button type="button" class="text-xs font-semibold text-[#B8924A] hover:underline px-1 py-1">Restore</button>
    </div>
  </header>

  <!-- Main Scrollable Content -->
  <main class="flex-1 px-5 pt-5 pb-8 max-w-md mx-auto w-full">
    <!-- Top Hero Badge & Headline -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-[#B8924A]/40 bg-[#FAF9F6] text-[#B8924A] mb-2.5">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
        <span class="text-[11px] font-bold tracking-widest uppercase">SEAFARER PRO</span>
      </div>

      <h2 class="font-serif text-2xl font-bold text-[#0B1F3A] leading-snug mb-2">
        Unlock Sovereign Fleet Folio
      </h2>
      <p class="text-xs text-[#0B1F3A]/70 max-w-[280px] mx-auto leading-relaxed">
        Unlock advanced DOCX export and premium features.
      </p>
    </div>

    <!-- Plan Cards Stack -->
    <div class="space-y-3.5 mb-6">
      <!-- 1. Weekly Card -->
      <label class="block cursor-pointer">
        <input type="radio" name="subscription_plan" value="weekly" class="peer sr-only">
        <div class="relative bg-[#FFFFFF] rounded-2xl p-4 border border-[#E6E2DA] transition-all peer-checked:border-[#B8924A] peer-checked:shadow-sm">
          <div class="flex items-start justify-between mb-2">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-base font-bold text-[#0B1F3A]">Weekly</h3>
              </div>
              <p class="text-[11px] text-[#0B1F3A]/60 mt-0.5">Auto-renewing subscription</p>
            </div>
            <div class="text-right">
              <span class="text-base font-bold text-[#0B1F3A]">$4.99</span>
              <span class="text-xs text-[#0B1F3A]/60 font-medium"> / week</span>
            </div>
          </div>

          <!-- Feature checklist -->
          <ul class="pt-2 border-t border-[#F4F3F0] space-y-1.5">
            <li class="flex items-center text-xs text-[#0B1F3A]/80">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Full DOCX profile export</span>
            </li>
            <li class="flex items-center text-xs text-[#0B1F3A]/80">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Direct email support</span>
            </li>
          </ul>
        </div>
      </label>

      <!-- 2. Monthly Card (Selected by default with brass border) -->
      <label class="block cursor-pointer">
        <input type="radio" name="subscription_plan" value="monthly" checked class="peer sr-only">
        <div class="relative bg-[#FFFFFF] rounded-2xl p-4 border-2 border-[#B8924A] shadow-sm transition-all peer-checked:border-[#B8924A] bg-gradient-to-b from-white to-[#FAF9F6]/40">
          <!-- Top Badge -->
          <div class="absolute -top-2.5 right-4 bg-[#B8924A] text-white text-[9px] font-bold tracking-wider uppercase px-2.5 py-0.5 rounded-full shadow-xs">
            MOST POPULAR
          </div>

          <div class="flex items-start justify-between mb-2">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-base font-bold text-[#0B1F3A]">Monthly</h3>
                <span class="w-2 h-2 rounded-full bg-[#B8924A]"></span>
              </div>
              <p class="text-[11px] text-[#0B1F3A]/60 mt-0.5">Auto-renewing subscription</p>
            </div>
            <div class="text-right">
              <span class="text-lg font-bold text-[#0B1F3A]">$14.99</span>
              <span class="text-xs text-[#0B1F3A]/60 font-medium"> / month</span>
            </div>
          </div>

          <!-- Feature checklist -->
          <ul class="pt-2 border-t border-[#F4F3F0] space-y-1.5">
            <li class="flex items-center text-xs text-[#0B1F3A] font-medium">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Full DOCX profile export</span>
            </li>
            <li class="flex items-center text-xs text-[#0B1F3A] font-medium">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Priority document formatting</span>
            </li>
            <li class="flex items-center text-xs text-[#0B1F3A] font-medium">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Unlimited sea-time records</span>
            </li>
          </ul>
        </div>
      </label>

      <!-- 3. Yearly Card -->
      <label class="block cursor-pointer">
        <input type="radio" name="subscription_plan" value="yearly" class="peer sr-only">
        <div class="relative bg-[#FFFFFF] rounded-2xl p-4 border border-[#E6E2DA] transition-all peer-checked:border-[#B8924A] peer-checked:shadow-sm">
          <!-- Top Badge -->
          <div class="absolute -top-2.5 right-4 bg-[#0B1F3A] text-white text-[9px] font-bold tracking-wider uppercase px-2.5 py-0.5 rounded-full">
            BEST VALUE
          </div>

          <div class="flex items-start justify-between mb-2">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-base font-bold text-[#0B1F3A]">Yearly</h3>
              </div>
              <p class="text-[11px] text-[#0B1F3A]/60 mt-0.5">Auto-renewing subscription</p>
            </div>
            <div class="text-right">
              <span class="text-base font-bold text-[#0B1F3A]">$89.99</span>
              <span class="text-xs text-[#0B1F3A]/60 font-medium"> / year</span>
              <div class="text-[10px] text-[#B8924A] font-semibold">Save 50% vs monthly</div>
            </div>
          </div>

          <!-- Feature checklist -->
          <ul class="pt-2 border-t border-[#F4F3F0] space-y-1.5">
            <li class="flex items-center text-xs text-[#0B1F3A]/80">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Full DOCX profile export</span>
            </li>
            <li class="flex items-center text-xs text-[#0B1F3A]/80">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>All premium features included</span>
            </li>
            <li class="flex items-center text-xs text-[#0B1F3A]/80">
              <svg class="w-3.5 h-3.5 text-[#B8924A] mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Best long-term value</span>
            </li>
          </ul>
        </div>
      </label>
    </div>

    <!-- Security & Trust note -->
    <div class="flex items-center justify-center gap-1.5 text-[11px] text-[#0B1F3A]/60 mb-2">
      <svg class="w-3.5 h-3.5 text-[#B8924A]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <span>Official Merchant Marine Registry Security Guarantee</span>
    </div>
  </main>

  <!-- Sticky Bottom Footer Actions & Disclosures -->
  <footer class="w-full bg-[#FAF9F6] border-t border-[#E6E2DA] px-5 pt-3.5 pb-6">
    <div class="max-w-md mx-auto w-full">
      <!-- Primary CTA button -->
      <button type="button" class="w-full h-13 py-3.5 px-6 rounded-full bg-[#0B1F3A] hover:bg-[#122b4d] active:scale-[0.99] text-white font-semibold text-sm tracking-wide shadow-md flex items-center justify-center gap-2 transition">
        <span>Upgrade to Pro</span>
        <svg class="w-4 h-4 text-[#B8924A]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <!-- Text Links -->
      <div class="flex items-center justify-center space-x-4 mt-3 text-xs text-[#0B1F3A]/70">
        <button type="button" class="hover:text-[#0B1F3A] underline underline-offset-2">Restore Purchases</button>
        <span class="text-[#E6E2DA]">•</span>
        <button type="button" class="hover:text-[#0B1F3A] underline underline-offset-2">Terms of Use</button>
        <span class="text-[#E6E2DA]">•</span>
        <button type="button" class="hover:text-[#0B1F3A] underline underline-offset-2">Privacy Policy</button>
      </div>

      <!-- Short Auto-renewal Disclosure text -->
      <p class="text-[10px] text-center text-[#0B1F3A]/50 mt-3 leading-normal px-2">
        Subscription automatically renews unless auto-renew is turned off at least 24 hours before the end of the current period.
      </p>
    </div>
  </footer>
</body>
</html>
