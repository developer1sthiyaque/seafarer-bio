<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add Sea Experience</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#FAF9F6',
            surfaceDim: '#EFECE6',
            navy: '#0B1F3A',
            brass: '#B8924A',
            borderHairline: '#E6E2DA',
            mutedSlate: '#64748B',
            fieldBg: '#FAF9F6',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #071527;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="flex justify-center items-end min-h-screen bg-slate-900/60 overflow-hidden">

  <!-- Mobile Screen Frame (390px viewport container) -->
  <div class="relative w-[390px] h-[844px] overflow-hidden flex flex-col justify-end bg-black/40 backdrop-blur-[2px]">

    <!-- Background dimming backdrop indicator / top preview context -->
    <div class="absolute top-0 left-0 right-0 h-[100px] px-6 pt-4 flex justify-between items-center text-white/50 text-xs">
      <div class="flex items-center gap-1 font-semibold tracking-wider text-[10px] text-white/70">
        <span>09:41</span>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-current opacity-70" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.64 10.59 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
        <svg class="w-3.5 h-3.5 fill-current opacity-70" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
        <div class="w-4 h-2 rounded-[2px] border border-white/60 p-[1px] flex items-center">
          <div class="w-full h-full bg-white/70 rounded-[1px]"></div>
        </div>
      </div>
    </div>

    <!-- Modal Bottom Sheet -->
    <div class="relative w-full max-h-[770px] bg-white rounded-t-[24px] shadow-2xl flex flex-col overflow-hidden border-t border-[#E6E2DA]">

      <!-- Top Drag Handle Pill -->
      <div class="w-full pt-3 pb-2 flex justify-center items-center">
        <div class="w-10 h-1 rounded-full bg-[#D8D4CC]"></div>
      </div>

      <!-- Sheet Header -->
      <div class="px-6 py-2.5 flex items-center justify-between border-b border-[#F0EDE6]">
        <div>
          <span class="block text-[10px] font-sans font-semibold tracking-widest text-[#B8924A] uppercase">Logbook Entry</span>
          <h2 class="font-serif text-[20px] font-semibold text-[#0B1F3A] tracking-tight leading-tight">Add Sea Experience</h2>
        </div>
        <button type="button" aria-label="Close modal" class="w-8 h-8 rounded-full flex items-center justify-center text-[#64748B] hover:text-[#0B1F3A] hover:bg-[#FAF9F6] transition-colors">
          <svg class="w-5 h-5 stroke-[1.75]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Form Scrollable Area -->
      <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4 no-scrollbar">

        <!-- Field 1: Ship Name -->
        <div class="space-y-1.5">
          <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
            Ship Name
          </label>
          <div class="relative flex items-center">
            <div class="absolute left-3.5 text-[#B8924A] pointer-events-none">
              <!-- Ship / Maritime Icon -->
              <svg class="w-4 h-4 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M2 20a6 6 0 0 0 6-2 6 6 0 0 1 6-2 6 6 0 0 1 6 2 6 6 0 0 0 4 1.5"/>
                <path d="M4 14l2-6h12l2 6"/>
                <path d="M12 4v4"/>
                <path d="M9 8h6"/>
              </svg>
            </div>
            <input 
              type="text" 
              placeholder="e.g. MV Pacific Mariner" 
              value="MV Nordic Sovereign"
              class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] pl-10 pr-3.5 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Field 2: Company Name -->
        <div class="space-y-1.5">
          <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
            Company Name
          </label>
          <div class="relative flex items-center">
            <div class="absolute left-3.5 text-[#B8924A] pointer-events-none">
              <!-- Building / Fleet Owner Icon -->
              <svg class="w-4 h-4 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
                <path d="M9 22v-4h6v4"/>
                <path d="M8 6h.01"/>
                <path d="M16 6h.01"/>
                <path d="M8 10h.01"/>
                <path d="M16 10h.01"/>
                <path d="M8 14h.01"/>
                <path d="M16 14h.01"/>
              </svg>
            </div>
            <input 
              type="text" 
              placeholder="e.g. Teekay Shipping Ltd" 
              value="Anglo-Eastern Ship Management"
              class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] pl-10 pr-3.5 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Row 3: Type & Rank (Two-column) -->
        <div class="grid grid-cols-2 gap-3">
          <!-- Type -->
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
              Type
            </label>
            <input 
              type="text" 
              placeholder="e.g. LNG Carrier" 
              value="LNG / Capesize"
              class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] px-3.5 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
            />
          </div>
          <!-- Rank -->
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
              Rank
            </label>
            <input 
              type="text" 
              placeholder="e.g. Motorman" 
              value="Chief Officer"
              class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] px-3.5 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Row 4: From & To Dates (Two-column) -->
        <div class="grid grid-cols-2 gap-3">
          <!-- From Date -->
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
              From
            </label>
            <div class="relative flex items-center">
              <input 
                type="text" 
                placeholder="DD/MM/YYYY" 
                value="01/05/2026"
                class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] pl-3.5 pr-9 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
              />
              <div class="absolute right-3 text-[#B8924A] pointer-events-none">
                <!-- Calendar Icon -->
                <svg class="w-4 h-4 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </div>
            </div>
          </div>
          <!-- To Date -->
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
              To
            </label>
            <div class="relative flex items-center">
              <input 
                type="text" 
                placeholder="DD/MM/YYYY" 
                value="30/04/2027"
                class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] pl-3.5 pr-9 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
              />
              <div class="absolute right-3 text-[#B8924A] pointer-events-none">
                <!-- Calendar Icon -->
                <svg class="w-4 h-4 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Row 5: GRT & BHP (Two-column) -->
        <div class="grid grid-cols-2 gap-3">
          <!-- GRT -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
                GRT
              </label>
              <span class="text-[9px] text-[#64748B] font-medium tracking-tight">Tonnage</span>
            </div>
            <input 
              type="number" 
              placeholder="e.g. 174000" 
              value="174000"
              class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] px-3.5 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
            />
          </div>
          <!-- BHP -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label class="block text-[11px] font-bold font-sans tracking-wider uppercase text-[#0B1F3A]">
                BHP
              </label>
              <span class="text-[9px] text-[#64748B] font-medium tracking-tight">Power</span>
            </div>
            <input 
              type="number" 
              placeholder="e.g. 24800" 
              value="28500"
              class="w-full bg-[#FAF9F6] border border-[#E6E2DA] rounded-[12px] px-3.5 py-2.5 text-[14px] text-[#0B1F3A] placeholder-[#94A3B8] font-sans font-medium focus:outline-none focus:border-[#0B1F3A] focus:bg-white transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Row 6: Period (Auto-calculated months container) -->
        <div class="bg-[#FAF9F6] border border-[#E6E2DA] rounded-[14px] p-3.5 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-[#FAF0DC] flex items-center justify-center text-[#B8924A]">
              <!-- Time / Period badge icon -->
              <svg class="w-3.5 h-3.5 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div>
              <span class="text-[12px] font-bold text-[#0B1F3A] tracking-wider uppercase font-sans">Period:</span>
              <span class="text-[11px] text-[#64748B] ml-1 font-normal">(in months)</span>
            </div>
          </div>
          <div class="bg-white border border-[#E6E2DA] px-3 py-1.5 rounded-full shadow-xs flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#B8924A]"></span>
            <span class="text-[13px] font-bold text-[#0B1F3A] font-sans">12 Months</span>
          </div>
        </div>

        <!-- Attestation Notice pill -->
        <div class="flex items-center gap-2 text-[10px] text-[#64748B] px-1 pt-1 pb-1">
          <svg class="w-3.5 h-3.5 text-[#B8924A] shrink-0 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Official STCW continuous discharge record compliance.</span>
        </div>

      </div>

      <!-- Sticky Bottom Action Footer -->
      <div class="px-6 pt-3 pb-7 bg-white border-t border-[#F0EDE6] space-y-2">
        <button 
          type="button" 
          class="w-full bg-[#0B1F3A] hover:bg-[#132c4f] active:bg-[#08172b] text-white font-sans font-semibold text-[15px] py-3.5 rounded-full tracking-wide transition-all shadow-md flex items-center justify-center gap-2"
        >
          <span>Add Experience</span>
          <svg class="w-4 h-4 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>

  </div>

</body>
</html>
